# Nginx Configuration with Gzip and Brotli Compression for ghaziurrehamn.com
server {
    listen 80;
    listen [::]:80;
    server_name www.ghaziurrehamn.com;
    return 301 https://ghaziurrehamn.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ghaziurrehamn.com;

    root /var/www/ghaziurrehamn.com/dist;
    index index.html;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/ghaziurrehamn.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ghaziurrehamn.com/privkey.pem;

    # Gzip Compression Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/ld+json
        image/svg+xml;

    # Brotli Compression (if ngx_brotli module is installed)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types
    #     text/plain
    #     text/css
    #     text/javascript
    #     text/xml
    #     application/json
    #     application/javascript
    #     application/x-javascript
    #     application/xml
    #     application/ld+json
    #     image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Immutable Cache for Hashed Static Assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # WebP and Media Cache
    location ~* \.(?:webp|jpg|jpeg|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Clean URLs & Static Prerendered HTML Fallback
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Explicit 404 for missing pages
    error_page 404 /index.html;
}
